aid: bitclout-deso
name: BitClout (DeSo)
description: 'DeSo (Decentralized Social, formerly BitClout) is an open-source layer-1
  blockchain purpose-built for storage-heavy applications such as social media, NFTs,
  creator coins, and on-chain financial primitives. It exposes a permissionless HTTP
  JSON API served by any DeSo node (the public node runs at node.deso.org/api/v0),
  a GraphQL endpoint, the DeSo Identity service for derived-key authentication and
  transaction signing, a client-side TypeScript SDK (deso-protocol), a Python SDK,
  a Rosetta API implementation for exchange integrations, and an official MCP server
  for AI-assisted development. Originally launched as the BitClout prototype and backed
  by Pantera Capital, the project rebranded to DeSo and now powers a broad ecosystem
  of decentralized social apps.'
